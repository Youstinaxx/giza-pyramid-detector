<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Giza Pyramid Detector</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen viewfinder — status strip, stage (camera/photo + overlay), control dock. Single dark "camera" look by choice. */
:root {
  --bg: #12100d;          /* night desert */
  --panel: #1d1a15;
  --line: #3a342a;
  --fg: #f2ebdf;
  --muted: #a99f8d;
  --accent: #e8b04b;      /* limestone gold */
  --ok: #57d68d; --warn: #f0a24a; --bad: #ff6b5e;
  --k-apex: #ff4d4d; --k-l: #39d353; --k-r: #4c8dff; --k-n: #ffd23f; --k-f: #2fe0e0;
  --display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--display); display: flex; flex-direction: column; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px 8px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 18px; letter-spacing: .01em; text-wrap: balance; }
h1 small { color: var(--muted); font-weight: 500; font-size: 12px; margin-left: 6px; }
.status { font: 500 12px var(--mono); color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); margin-right: 6px; vertical-align: 1px; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
main { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding-block: 4px 12px; }
.stage { position: relative; flex: 1; min-height: 240px; background: #000; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: grid; place-items: center; }
.stage canvas { max-width: 100%; max-height: 100%; display: block; }
.stage .msg { position: absolute; inset: auto 12px 12px 12px; font: 12px var(--mono); color: var(--fg); background: rgba(18,16,13,.82); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.readout { position: absolute; top: 10px; left: 10px; font: 500 12px var(--mono); background: rgba(18,16,13,.78); padding: 6px 8px; border-radius: 6px; font-variant-numeric: tabular-nums; }
.dock { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
button, .btn { font: 600 14px var(--display); color: var(--bg); background: var(--accent); border: 0; border-radius: 9px; padding: 12px 14px; cursor: pointer; text-align: center; }
button.ghost, .btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
button:focus-visible, .btn:focus-within, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: default; }
.btn input { display: none; }
.settings { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; font: 12px var(--mono); color: var(--muted); }
.settings label { display: flex; align-items: center; gap: 8px; }
.settings input[type=range] { width: 120px; accent-color: var(--accent); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font: 12px var(--mono); color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap" style="flex:1;display:flex;flex-direction:column;min-height:0">
  <header>
    <h1>Giza Pyramid Detector <small>YOLO26n-pose · synthetic v1</small></h1>
    <div class="status"><span id="st"><span class="dot"></span>Loading model…</span><span id="perf"></span></div>
  </header>
  <main>
    <div class="stage" id="stage">
      <canvas id="view" width="720" height="1280" aria-label="Camera view with detections"></canvas>
      <div class="readout" id="readout">—</div>
      <div class="msg" id="msg" hidden></div>
    </div>
    <div class="dock">
      <button id="live">Live camera</button>
      <label class="btn">Take photo<input id="photo" type="file" accept="image/*" capture="environment"></label>
      <label class="btn">Record video<input id="video" type="file" accept="video/*" capture="environment"></label>
      <label class="btn ghost">From gallery<input id="pick" type="file" accept="image/*,video/*"></label>
    </div>
    <div class="settings">
      <label for="thr">Min score <input id="thr" type="range" min="0.2" max="0.9" step="0.05" value="0.5"> <span id="thrv">0.50</span></label>
      <label for="rate">Video speed
        <select id="rate"><option value="1">1×</option><option value="0.5">0.5×</option><option value="0.25" selected>0.25×</option></select></label>
      <button class="ghost" id="stop" style="padding:6px 10px">Stop</button>
    </div>
    <div class="legend"><span><i style="background:var(--k-apex)"></i>Apex</span><span><i style="background:var(--k-l)"></i>L corner</span><span><i style="background:var(--k-r)"></i>R corner</span><span><i style="background:var(--k-n)"></i>N near</span><span><i style="background:var(--k-f)"></i>F far</span><span>hollow = hidden / unsure</span></div>
  </main>
</div>

<script src="ort/ort.wasm.min.js"></script>
<script>
const S = 480, N = 4725;
const $ = id => document.getElementById(id);
const view = $('view'), ctx = view.getContext('2d');
const lb = document.createElement('canvas'); lb.width = lb.height = S;
const lctx = lb.getContext('2d', { willReadFrequently: true });
const KC = ['--k-apex', '--k-l', '--k-r', '--k-n', '--k-f'].map(v => getComputedStyle(document.documentElement).getPropertyValue(v).trim());
const KN = ['A', 'L', 'R', 'N', 'F'];
let session = null, busy = false, running = null, stream = null, mediaEl = null, prev = null, times = [];

function status(text, cls) { $('st').innerHTML = `<span class="dot ${cls || ''}"></span>${text}`; }
function msg(t) { $('msg').hidden = !t; $('msg').textContent = t || ''; }
const thr = () => parseFloat($('thr').value);
$('thr').oninput = () => { $('thrv').textContent = thr().toFixed(2); if (still) runStill(still); };

async function loadModel() {
  ort.env.wasm.wasmPaths = new URL('ort/', location.href).href;
  ort.env.wasm.numThreads = (self.crossOriginIsolated ? Math.min(4, navigator.hardwareConcurrency || 1) : 1);
  const res = await fetch('pyramid480.b64.txt');
  if (!res.ok) throw new Error('model download failed (' + res.status + ')');
  const total = +res.headers.get('content-length') || 13685288; const reader = res.body.getReader(); const parts = []; let got = 0;
  for (;;) { const { done, value } = await reader.read(); if (done) break; parts.push(value); got += value.length; status(`Downloading model ${Math.min(100, Math.round(100 * got / total))}%`); }
  const txt = new Uint8Array(got); let o = 0; for (const p of parts) { txt.set(p, o); o += p.length; }
  const bin = atob(new TextDecoder().decode(txt).trim()); const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  status('Starting engine…');
  session = await ort.InferenceSession.create(buf, { executionProviders: ['wasm'], graphOptimizationLevel: 'all' });
  status(`Model ready · ${ort.env.wasm.numThreads} thread`, 'ok');
}

async function detect(src, w, h) {
  const r = Math.min(S / w, S / h), nw = Math.round(w * r), nh = Math.round(h * r), dx = (S - nw) >> 1, dy = (S - nh) >> 1;
  lctx.fillStyle = 'rgb(114,114,114)'; lctx.fillRect(0, 0, S, S); lctx.drawImage(src, dx, dy, nw, nh);
  const px = lctx.getImageData(0, 0, S, S).data, f = new Float32Array(3 * S * S), A = S * S;
  for (let i = 0, j = 0; i < A; i++, j += 4) { f[i] = px[j] / 255; f[i + A] = px[j + 1] / 255; f[i + 2 * A] = px[j + 2] / 255; }
  const t0 = performance.now();
  const out = await session.run({ [session.inputNames[0]]: new ort.Tensor('float32', f, [1, 3, S, S]) });
  const ms = performance.now() - t0;
  const d = out[session.outputNames[0]].data, c = thr(), cand = [];
  for (let n = 0; n < N; n++) {
    const s = d[4 * N + n]; if (s < c) continue;
    const cx = d[n], cy = d[N + n], bw = d[2 * N + n], bh = d[3 * N + n];
    const k = []; for (let j = 0; j < 5; j++) k.push([(d[(5 + 3 * j) * N + n] - dx) / r, (d[(6 + 3 * j) * N + n] - dy) / r, d[(7 + 3 * j) * N + n]]);
    cand.push({ s, b: [(cx - bw / 2 - dx) / r, (cy - bh / 2 - dy) / r, (cx + bw / 2 - dx) / r, (cy + bh / 2 - dy) / r], k });
  }
  cand.sort((a, b) => b.s - a.s); const keep = [];
  const iou = (a, b) => { const x1 = Math.max(a[0], b[0]), y1 = Math.max(a[1], b[1]), x2 = Math.min(a[2], b[2]), y2 = Math.min(a[3], b[3]);
    const i = Math.max(0, x2 - x1) * Math.max(0, y2 - y1); return i / ((a[2] - a[0]) * (a[3] - a[1]) + (b[2] - b[0]) * (b[3] - b[1]) - i); };
  for (const p of cand) if (keep.every(q => iou(p.b, q.b) < 0.5)) keep.push(p);
  keep.sort((a, b) => (b.b[2] - b.b[0]) - (a.b[2] - a.b[0]));
  return { dets: keep, ms };
}

function smooth(dets, w) {
  if (!dets.length) { prev = null; return dets; }
  const m = dets[0];
  if (prev && Math.hypot(m.k[0][0] - prev.k[0][0], m.k[0][1] - prev.k[0][1]) < 0.15 * w) {
    const a = 0.5; m.k.forEach((p, j) => { p[0] = a * prev.k[j][0] + (1 - a) * p[0]; p[1] = a * prev.k[j][1] + (1 - a) * p[1]; });
    m.b = m.b.map((v, j) => a * prev.b[j] + (1 - a) * v);
  }
  prev = JSON.parse(JSON.stringify(m)); return dets;
}

function fitCanvas(w, h) { if (view.width !== w || view.height !== h) { view.width = w; view.height = h; } }
function drawDets(dets, w) {
  const L = Math.max(2, w / 360);
  for (const d of dets) {
    const k = d.k, ok = k.map(p => p[2] > 0.5), P = k.map(p => [p[0], p[1]]);
    ctx.strokeStyle = '#e8b04b'; ctx.lineWidth = L; ctx.strokeRect(d.b[0], d.b[1], d.b[2] - d.b[0], d.b[3] - d.b[1]);
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = L * 1.2; ctx.beginPath();
    const seg = (a, b) => { ctx.moveTo(...P[a]); ctx.lineTo(...P[b]); };
    for (const j of [1, 2, 3]) if (ok[0] && ok[j]) seg(0, j);
    if (ok[1] && ok[3]) seg(1, 3); if (ok[3] && ok[2]) seg(3, 2); if (ok[1] && ok[2] && !ok[3]) seg(1, 2);
    ctx.stroke();
    k.forEach((p, j) => { if (p[2] < 0.2) return; ctx.beginPath(); ctx.arc(p[0], p[1], L * 3.2, 0, 7);
      if (ok[j]) { ctx.fillStyle = KC[j]; ctx.fill(); } else { ctx.strokeStyle = KC[j]; ctx.lineWidth = L; ctx.stroke(); }
      ctx.fillStyle = KC[j]; ctx.font = `600 ${Math.round(L * 7)}px IBM Plex Mono, monospace`; ctx.fillText(KN[j], p[0] + L * 4, p[1] - L * 3); });
    ctx.fillStyle = '#e8b04b'; ctx.font = `600 ${Math.round(L * 7)}px IBM Plex Mono, monospace`; ctx.fillText(d.s.toFixed(2), d.b[0], Math.max(L * 8, d.b[1] - L * 3));
  }
}
function report(dets, ms) {
  times.push(ms); if (times.length > 20) times.shift();
  const avg = times.reduce((a, b) => a + b, 0) / times.length;
  $('perf').textContent = `${avg.toFixed(0)} ms/frame · ${(1000 / avg).toFixed(1)} fps model`;
  $('readout').textContent = dets.length ? `${dets.length} pyramid${dets.length > 1 ? 's' : ''} · score ${dets[0].s.toFixed(2)}` : 'no pyramid';
}

let still = null;
async function runStill(img) {
  stopAll(); still = img; const w = img.naturalWidth, h = img.naturalHeight;
  fitCanvas(w, h); ctx.drawImage(img, 0, 0);
  const { dets, ms } = await detect(img, w, h); prev = null; drawDets(dets, w); report(dets, ms);
}

function loopMedia(el, isLive) {
  mediaEl = el; const token = {}; running = token; prev = null; times = []; still = null;
  let last = { dets: [] };
  const frame = async () => {
    if (running !== token) return;
    const w = el.videoWidth, h = el.videoHeight;
    if (w && h) {
      fitCanvas(w, h); ctx.drawImage(el, 0, 0, w, h); drawDets(last.dets, w);
      if (!busy) { busy = true; const snap = document.createElement('canvas'); snap.width = w; snap.height = h; snap.getContext('2d').drawImage(el, 0, 0, w, h);
        detect(snap, w, h).then(r => { if (running === token) { last = { dets: smooth(r.dets, w) }; report(r.dets, r.ms); } }).catch(e => msg('Model error: ' + e.message)).finally(() => busy = false); }
    }
    if (!isLive && el.ended) { msg('Video finished · pick another or press Live camera'); return; }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

function stopAll(clearStill = true) {
  running = null; if (clearStill) still = null;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  if (mediaEl) { try { mediaEl.pause(); } catch (e) {} if (mediaEl.src && mediaEl.src.startsWith('blob:')) URL.revokeObjectURL(mediaEl.src); mediaEl = null; }
}
$('stop').onclick = () => { stopAll(false); msg('Stopped'); };

// Back camera first: exact 'environment', then a device labelled back/rear, then whatever the browser gives.
async function openBackCamera() {
  const size = { width: { ideal: 1280 }, height: { ideal: 720 } };
  try { return await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: 'environment' }, ...size }, audio: false }); } catch (e) {}
  const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, ...size }, audio: false });
  const cur = s.getVideoTracks()[0];
  if (/back|rear|environment|خلف/i.test(cur.label) || cur.getSettings().facingMode === 'environment') return s;
  const cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  const back = cams.find(d => /back|rear|environment|خلف/i.test(d.label));
  if (!back) return s;
  s.getTracks().forEach(t => t.stop());
  return navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: back.deviceId }, ...size }, audio: false });
}
$('live').onclick = async () => {
  msg('');
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error('no camera API');
    stopAll();
    stream = await openBackCamera();
    const v = document.createElement('video'); v.playsInline = true; v.muted = true; v.srcObject = stream; await v.play();
    loopMedia(v, true);
  } catch (e) {
    msg('Live camera is blocked on this page. Use "Take photo" or "Record video" — they open your phone camera and run the same model on the result. Live mode works when this page is hosted on a regular https site.');
  }
};

function handleFile(file) {
  if (!file || !session) return; msg('');
  const url = URL.createObjectURL(file);
  if (file.type.startsWith('video')) {
    stopAll(); const v = document.createElement('video'); v.playsInline = true; v.muted = true; v.src = url;
    v.playbackRate = parseFloat($('rate').value);
    v.onloadeddata = () => { v.play().then(() => loopMedia(v, false)).catch(() => msg('Could not play this video')); };
    v.onerror = () => msg('This video format could not be opened in the browser. Try recording in H.264 / "Most compatible".');
  } else {
    const img = new Image(); img.onload = () => runStill(img); img.onerror = () => msg('Could not open this image'); img.src = url;
  }
}
for (const id of ['photo', 'video', 'pick']) $(id).onchange = e => { handleFile(e.target.files[0]); e.target.value = ''; };
$('rate').onchange = () => { if (mediaEl && !mediaEl.srcObject) mediaEl.playbackRate = parseFloat($('rate').value); };

// at rest: draw the sample photo, then detect once the model is ready
const sample = new Image(); sample.src = 'sample.jpg';
sample.onload = () => { fitCanvas(sample.naturalWidth, sample.naturalHeight); ctx.drawImage(sample, 0, 0); $('readout').textContent = 'sample photo · loading model'; };
loadModel().then(() => sample.complete ? runStill(sample) : (sample.onload = () => runStill(sample)))
  .catch(e => { status('Model failed to load', 'bad'); msg(e.message); });
</script>

</body></html>
